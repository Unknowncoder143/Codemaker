            <!-- Chatbot Assistant -->
<div class="col-md-4 mb-4">
  <div class="card">
    <div class="card-body">
      <h3>AI Chatbot Assistant</h3>
      <div id="chatbox" style="height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px;"></div>
      <input id="chat-input" type="text" class="form-control mb-2" placeholder="Ask me anything..." />
      <button class="btn btn-primary w-100" onclick="sendMessage()">Send</button>

  </div>
</div>
  
      <!-- Code Editor Section -->

        <div class="card">
          <div class="card-body">
            <h3>Code Editor</h3>
            <textarea id="html-code" class="form-control" rows="10" placeholder="Write your HTML, CSS, or JavaScript code here..."></textarea>
          </div>

      <!-- Run Code Button -->

        </div>
      </div>

      <!-- Error Output -->

<script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_GB/sdk.js#xfbml=1&version=v21.0"></script>

<script>
  let messages = []; // Store chat history

  async function sendMessage() {
    const chatInput = document.getElementById('chat-input');
    const chatbox = document.getElementById('chatbox');
    const userMessage = chatInput.value.trim();

    if (!userMessage) return;

    // Display user message
    chatbox.innerHTML += `<div><strong>You:</strong> ${userMessage}</div>`;
    chatInput.value = '';
    chatbox.scrollTop = chatbox.scrollHeight;

    // Add user message to history
    messages.push({ role: 'user', content: userMessage });

    try {
      // Send message to Netlify Function
      const response = await fetch('/.netlify/functions/hello', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages })
      });

      const data = await response.json();
      const botReply = data.reply;

      // Display bot reply
      chatbox.innerHTML += `<div><strong>Bot:</strong> ${botReply}</div>`;
      chatbox.scrollTop = chatbox.scrollHeight;

      // Add bot response to history
      messages.push({ role: 'assistant', content: botReply });

    } catch (error) {
      chatbox.innerHTML += `<div style="color: red;"><strong>Error:</strong> ${error.message}</div>`;
    }
  }
</script>

    

  <!-- Bootstrap and Custom Script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function runCode() {
      const code = document.getElementById('html-code').value;
      const iframe = document.getElementById('result');
      const errorOutput = document.getElementById('error-output');

      // Clear previous errors
      errorOutput.textContent = '';

      try {
        // Create the iframe document
        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
        iframeDoc.open();
        iframeDoc.write(code);
        iframeDoc.close();
      } catch (error) {
        // Display runtime errors
        errorOutput.textContent = `Error: ${error.message}`;
      }

      // Capture runtime errors from the iframe itself
      iframe.contentWindow.onerror = function (message, source, lineno, colno, error) {
        errorOutput.textContent += `Error: ${message} at line ${lineno}, column ${colno}\n`;
        return true; // Prevent default error handling
      };
    }
  </script>

</body>
